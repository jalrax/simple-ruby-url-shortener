stages:
  - mirror

mirror_to_github:
  stage: mirror
  script:
    - git remote add github https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_USERNAME}/${GITHUB_REPO_NAME}.git || true
    - git push --mirror github
  only:
    - main
    - master
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0